[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itdesk-env"
version = "1.0.0"
description = "IT Helpdesk Incident Triage Environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "requests>=2.25.1",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"
